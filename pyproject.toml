[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomeforge"
version = "0.1.1"
description = "DSL compiler and evolutionary sandbox for genome-defined distributed systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Alena Rejdová / OpenAI session build"}]
license = {text = "Proprietary"}
dependencies = [
  "jinja2>=3.1",
  "lark>=1.1"
]
keywords = ["dsl", "compiler", "evolution", "genetic-algorithm", "codegen"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent"
]

[project.urls]
Repository = "https://github.com/peitn/genome-forge"

[project.scripts]
genomeforge = "genomeforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genomeforge = ["templates/*.j2"]
